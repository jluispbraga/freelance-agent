[project]
name = "freelance-agent"
version = "0.0.0"
description = "Operação de freelancer parcialmente autônoma: descoberta e avaliação de oportunidades"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "procrastinate>=3.11.0",
    "psycopg[binary]>=3.3.9",
    "python-telegram-bot>=22.8",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pytest>=8",
    "pytest-django>=4.14.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p pytester"
markers = [
    "postgres: exige PostgreSQL real (DATABASE_URL como fa_owner e DATABASE_URL_APP como fa_app)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Só app.actions.executors importa anthropic, httpx(2), httpcore(2) e telegram"
type = "forbidden"
source_modules = ["app"]
# httpx2/httpcore2 são as distribuições 2.x instaladas lado a lado com httpx/httpcore.
forbidden_modules = ["anthropic", "httpx", "httpx2", "httpcore", "httpcore2", "telegram"]
unmatched_ignore_imports_alerting = "none"  # executors ainda não existem
ignore_imports = [
    "app.actions.executors -> anthropic",
    "app.actions.executors -> httpx",
    "app.actions.executors -> httpx2",
    "app.actions.executors -> httpcore",
    "app.actions.executors -> httpcore2",
    "app.actions.executors -> telegram",
    "app.actions.executors.** -> anthropic",
    "app.actions.executors.** -> httpx",
    "app.actions.executors.** -> httpx2",
    "app.actions.executors.** -> httpcore",
    "app.actions.executors.** -> httpcore2",
    "app.actions.executors.** -> telegram",
]
